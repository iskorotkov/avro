<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img">
<title>Geometric mean over datasets: time per op relative to avro (lower is better)</title>
<desc>Grouped horizontal bars of geometric-mean relative encode and decode time per format versus avro.</desc>
<style>
:root{--bg:#fcfcfb;--fg:#0b0b0b;--muted:#52514e;--grid:#e3e2de;--other:#85847e;--base:#2a78d6;--alt:#eb6834}
