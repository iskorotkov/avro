# Builds avrogen and avrosv archives; .github/workflows/release.yml uploads them to the release.
version: 2

builds:
  - &build
    id: avrogen
    main: ./cmd/avrogen
    binary: avrogen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_386
      - linux_amd64
      - linux_arm_7
      - linux_arm64
      - linux_ppc64le
      - linux_s390x
      - darwin_amd64
      - darwin_arm64
      - windows_386
      - windows_amd64
  - <<: *build
    id: avrosv
    main: ./cmd/avrosv
    binary: avrosv

archives:
  - &archive
    id: avrogen
    ids: [avrogen]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENCE, README.md]
  - <<: *archive
    id: avrosv
    ids: [avrosv]

checksum:
  name_template: checksums.txt
