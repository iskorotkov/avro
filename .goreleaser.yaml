# Builds avrogen and avrosv archives; .github/workflows/release.yml uploads them to the published release.
version: 2

builds:
  - &build
    id: avrogen
    main: ./cmd/avrogen
    binary: avrogen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Version comes from Go's VCS stamping of the release tag, so no -X flags are needed.
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: ["386", amd64, arm, arm64, ppc64le, s390x]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: "386" }
      - { goos: darwin, goarch: arm }
      - { goos: darwin, goarch: ppc64le }
      - { goos: darwin, goarch: s390x }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: arm64 }
      - { goos: windows, goarch: ppc64le }
      - { goos: windows, goarch: s390x }
  - <<: *build
    id: avrosv
    main: ./cmd/avrosv
    binary: avrosv

archives:
  - &archive
    id: avrogen
    ids: [avrogen]
    name_template: "avrogen_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENCE, README.md]
  - <<: *archive
    id: avrosv
    ids: [avrosv]
    name_template: "avrosv_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

checksum:
  name_template: checksums.txt

# Release notes are written by hand.
changelog:
  disable: true
