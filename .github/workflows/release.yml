on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload binaries for, e.g. v2.36.0"
        required: true
        type: string

name: release binaries

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GO_VERSION: "1.27"
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Older tags predate .goreleaser.yaml, so take it from the commit the workflow runs from.
      - name: Load GoReleaser config
        run: git show "${GITHUB_SHA}:.goreleaser.yaml" > "${RUNNER_TEMP}/.goreleaser.yaml"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --skip=publish --config ${{ runner.temp }}/.goreleaser.yaml
        env:
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      # gh only adds assets, so the hand-written title, notes and prerelease flag stay untouched.
      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
