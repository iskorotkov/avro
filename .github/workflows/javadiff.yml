on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

name: run java conformance

permissions:
  contents: read

jobs:
  javadiff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_VERSION: "1.26"
      JAVA_VERSION: "21.0.8"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        id: install-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download
        if: steps.install-go.outputs.cache-hit != 'true'

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: testdata/javadiff/pom.xml

      - name: Build Java harness
        run: |
          mvn -B -q -f testdata/javadiff/pom.xml package
          echo "JAVADIFF_JAR=${GITHUB_WORKSPACE}/testdata/javadiff/target/javadiff.jar" >> "${GITHUB_ENV}"

      - name: Run conformance against Java
        run: java -version && go test -tags javadiff -run '^(TestConformance|TestJavaDifferential)' -count=1 -v .
