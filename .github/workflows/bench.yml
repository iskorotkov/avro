on:
  pull_request:
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "bench/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

name: bench

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Timing comparisons are too noisy on shared runners; run `go run ./cmd/report` locally instead.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bench

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Lint
        run: |
          go -C .. build -o "$RUNNER_TEMP/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          "$RUNNER_TEMP/golangci-lint" run ./...
          "$RUNNER_TEMP/golangci-lint" fmt --diff ./...

      - name: Test
        run: go test ./...

      - name: Run each benchmark once to check round trips
        run: go test -run='^$' -bench=. -benchtime=1x ./...
